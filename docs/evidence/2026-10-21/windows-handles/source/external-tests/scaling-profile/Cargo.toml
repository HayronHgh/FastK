[package]
name = "fastk-scaling-profile"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
fastk = { path = "../.." }
rayon = "=1.12.0"
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
rustix = "=1.1.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1
strip = false
