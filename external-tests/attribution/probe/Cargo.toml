[package]
name = "fastk-attribution-probe"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "_fastk_attribution"
crate-type = ["cdylib"]

[dependencies]
fastk = { path = "../../.." }
pyo3 = { version = "=0.30.1", features = ["extension-module"] }
numpy = "=0.30.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"
