[package]
name = "fastk-core-parallel"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
fastk = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"
