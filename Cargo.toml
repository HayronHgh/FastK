[package]
name = "fastk"
version = "0.2.0-rc.1"
edition = "2021"
rust-version = "1.89"
description = "Versioned fixed-record time-series storage engine for normalized records."
readme = "README.md"
license = "MIT"
keywords = ["timeseries", "storage", "market-data", "binary-format", "sqlite"]
categories = ["database-implementations", "data-structures"]
exclude = [
    "/target/**",
    "/dist/**",
    "/data/**",
    "/series/**",
    "/tmp/**",
    "/clients/**",
    "/external-tests/**",
    "*.db",
    "*.sqlite",
    "*.7z",
    "*.zip",
]
# TODO: set repository/homepage before publishing to crates.io.

[lib]
name = "fastk"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rayon = "=1.12.0"
bytemuck = { version = "=1.25.2", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
rustix = "=1.1.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[workspace]
members = ["clients/python-native"]
default-members = ["."]
resolver = "2"

[features]
# Explicit opt-in for subprocess crash tests. Never enabled in release artifacts.
fault-injection = []

[dev-dependencies]
tempfile = "3"

[[example]]
name = "fastk_bridge"
path = "examples/cli/fastk_bridge.rs"

[[example]]
name = "fastk_admin"
path = "examples/cli/fastk_admin.rs"

[[example]]
name = "backtest_facade_demo"
path = "examples/demos/backtest_facade_demo.rs"

[[example]]
name = "indicator_series_demo"
path = "examples/demos/indicator_series_demo.rs"

[[example]]
name = "prepare_python_demo_store"
path = "examples/demos/prepare_python_demo_store.rs"

[[example]]
name = "bench_acceptance"
path = "examples/benchmarks/bench_acceptance.rs"

[[example]]
name = "bench_backtest_facade"
path = "examples/benchmarks/bench_backtest_facade.rs"

[[example]]
name = "bench_scalar_sidecars"
path = "examples/benchmarks/bench_scalar_sidecars.rs"

[[example]]
name = "bench_kline_storage_comparison"
path = "examples/benchmarks/bench_kline_storage_comparison.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.native]
inherits = "release"
panic = "unwind"
