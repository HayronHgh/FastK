[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fastk-client"
version = "0.2.0rc1"
description = "Small subprocess client for the FastK time-series storage engine"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fastk_client = ["py.typed", "_bin/*"]
