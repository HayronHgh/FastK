[package]
name = "fastk-native"
version = "0.2.0-rc.1"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
fastk = { path = "../.." }
pyo3 = "=0.30.1"
numpy = "=0.30.0"
bytemuck = { version = "=1.25.2", features = ["extern_crate_alloc"] }

